name: Publish to PyPI

# Publishes to PyPI when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# Authentication is via PyPI Trusted Publishing (OIDC) — no API token/secret needed.
# One-time setup: add a Trusted Publisher for project "ishelf-ee" at
# https://pypi.org/manage/account/publishing/ pointing at this repo + workflow.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
